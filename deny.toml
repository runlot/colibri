# cargo-deny configuration. Checked in before there is a Cargo workspace so that
# the first dependency is already subject to it (D17).

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "PostgreSQL",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "0BSD",
  "MPL-2.0",
  # Boost Software License 1.0: permissive, no copyleft; needed by xxhash-rust
  # (docs/06 §6). Not to be confused with BUSL-1.1, which stays denied.
  "BSL-1.0",
]
# Everything not listed is denied, which covers GPL-*, LGPL-*, AGPL-*, SSPL,
# BUSL-1.1 (another vendor's BSL), Elastic-2.0 and unknown licences.
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[advisories]
yanked = "deny"
unmaintained = "workspace"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
